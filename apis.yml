aid: department-of-the-treasury
name: Department of the Treasury
description: >-
  The U.S. Department of the Treasury manages federal finances, public debt, Treasury securities, U.S. currency
  production, tax administration, financial sanctions, and economic-statistical reporting. Treasury bureaus publish
  several public APIs, anchored by the Bureau of the Fiscal Service's Fiscal Data API and the Office of Foreign Assets
  Control's Sanctions List Service.
